apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robot-agent-sim-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robot-agent-sim-sessions
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
